name = "taxis-kanban"
main = "src/index.js"
compatibility_date = "2026-06-13"

# Bundles Yjs for the browser into app/js/vendor/ (runs before dev/deploy).
[build]
command = "npm run build:client"

[[durable_objects.bindings]]
name = "JOB_DO"
class_name = "JobDO"

[[durable_objects.bindings]]
name = "BOARD_DO"
class_name = "BoardDO"

[[durable_objects.bindings]]
name = "CATALOG_DO"
class_name = "CatalogDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobDO", "BoardDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CatalogDO"]

[assets]
directory = "app"
binding = "ASSETS"
not_found_handling = "404-page"
# Unknown paths would otherwise be served as index.html before this Worker runs.
run_worker_first = true
