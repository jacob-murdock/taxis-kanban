<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Accept invite · Taxis Kanban</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to invite</a>
  <header class="site-header">
    <div class="header-top">
      <nav><a href="/">← Boards</a></nav>
      <button type="button" class="btn theme-toggle" data-theme-toggle>Theme: system</button>
    </div>
    <h1>Board invite</h1>
    <p id="page-error" class="page-error" role="alert"></p>
  </header>

  <main id="content" class="stack invite-panel" tabindex="-1">
    <p id="invite-status" class="tagline" role="status">Checking invite…</p>
    <button type="button" id="accept-btn" class="btn-primary" hidden>Accept invite</button>
  </main>

  <script type="module" src="/js/invite.js"></script>
</body>
</html>
