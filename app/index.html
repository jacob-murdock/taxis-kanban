<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Taxis Kanban</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <h1>Taxis Kanban</h1>
    <p class="tagline">Boards</p>
    <p id="page-error" class="page-error" role="alert"></p>
  </header>

  <main class="stack">
    <form id="create-board-form" class="create-board">
      <input id="new-board-name" type="text" name="name" maxlength="80" required placeholder="Board name" aria-label="Board name" autocomplete="off">
      <button type="submit" class="btn-primary">Create</button>
    </form>
    <label class="show-archived">
      <input id="show-archived" type="checkbox">
      Show archived
    </label>
    <ul id="board-list" class="board-list">
      <li class="placeholder">Loading…</li>
    </ul>
  </main>

  <footer class="site-footer">
    <p id="connection-status" class="connection-status" data-state="connecting">Connecting…</p>
  </footer>

  <script type="module" src="/js/boards.js"></script>
</body>
</html>
