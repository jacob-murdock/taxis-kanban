<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Taxis Kanban</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <div>
        <h1>Taxis Kanban</h1>
        <p class="tagline">Active jobs board</p>
      </div>
      <button type="button" id="new-job-btn" class="btn-primary">+ New job</button>
    </div>
  </header>

  <main id="board" class="board" aria-label="Kanban board">
    <!-- Columns populated by board.js — lifecycle: lead → scoped → active → review → done → invoiced → paid -->
    <section class="board-column" data-status="lead">
      <h2>Lead</h2>
      <ul class="card-list" data-dropzone></ul>
    </section>
    <section class="board-column" data-status="scoped">
      <h2>Scoped</h2>
      <ul class="card-list" data-dropzone></ul>
    </section>
    <section class="board-column" data-status="active">
      <h2>Active</h2>
      <ul class="card-list" data-dropzone></ul>
    </section>
    <section class="board-column" data-status="review">
      <h2>Review</h2>
      <ul class="card-list" data-dropzone></ul>
    </section>
    <section class="board-column" data-status="done">
      <h2>Done</h2>
      <ul class="card-list" data-dropzone></ul>
    </section>
    <section class="board-column" data-status="invoiced">
      <h2>Invoiced</h2>
      <ul class="card-list" data-dropzone></ul>
    </section>
    <section class="board-column" data-status="paid">
      <h2>Paid</h2>
      <ul class="card-list" data-dropzone></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p id="connection-status" class="connection-status" data-state="connecting">Connecting…</p>
  </footer>

  <script type="module" src="/js/board.js"></script>
</body>
</html>
