<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Card · Taxis Kanban</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to card</a>
  <header class="site-header">
    <div class="header-top">
      <nav><a id="back-link" href="/">← Board</a></nav>
      <button type="button" class="btn theme-toggle" data-theme-toggle>Theme: system</button>
    </div>
    <h1 id="card-title" spellcheck="true">Loading…</h1>
    <p id="card-meta" class="card-meta muted"></p>
    <p id="page-error" class="page-error" role="alert"></p>
  </header>

  <main id="content" class="card-page" tabindex="-1">
    <aside class="card-fields">
      <dl>
        <dt><label for="field-column">Column</label></dt>
        <dd>
          <select id="field-column" disabled></select>
        </dd>

        <dt><label for="field-position">Position</label></dt>
        <dd>
          <select id="field-position" disabled></select>
        </dd>

        <dt><label for="field-assignee">Assignee</label></dt>
        <dd>
          <input id="field-assignee" type="text" maxlength="80" placeholder="Name" autocomplete="off" disabled>
        </dd>

        <dt><label for="field-due">Due</label></dt>
        <dd>
          <input id="field-due" type="date" disabled>
        </dd>

        <dt><label for="field-label">Labels</label></dt>
        <dd>
          <ul id="label-list" class="label-list"></ul>
          <form id="label-form" class="label-form" hidden>
            <input id="field-label" type="text" maxlength="30" placeholder="Add a label" autocomplete="off">
          </form>
        </dd>
      </dl>
      <div class="card-actions">
        <button type="button" id="archive-btn" class="btn" hidden>Archive</button>
        <button type="button" id="delete-btn" class="btn" hidden>Delete</button>
      </div>
    </aside>

    <article class="card-notes">
      <h2 id="notes-heading"><label for="card-body">Notes</label></h2>
      <div id="card-preview" class="markdown-preview placeholder" tabindex="0">Markdown notes…</div>
      <textarea id="card-body" class="markdown-body" rows="16" placeholder="Markdown notes…" readonly hidden></textarea>
    </article>

    <aside class="card-history">
      <h2>Recent changes</h2>
      <ol id="history-list" class="history-list">
        <li class="placeholder">No changes yet.</li>
      </ol>
    </aside>
  </main>

  <footer class="site-footer">
    <p id="connection-status" class="connection-status" role="status" data-state="connecting">Connecting…</p>
    <div id="presence" class="presence" hidden></div>
    <div id="activity-log" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  </footer>

  <script type="module" src="/js/card.js"></script>
</body>
</html>
