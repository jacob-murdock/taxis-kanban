<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Job · Taxis Kanban</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="/">← Board</a>
    </nav>
    <h1 id="job-title" contenteditable="plaintext-only" spellcheck="true">Loading…</h1>
    <p id="job-meta" class="job-meta"></p>
  </header>

  <main class="job-page">
    <aside class="job-fields">
      <dl>
        <dt>Status</dt>
        <dd>
          <select id="field-status">
            <option value="lead">lead</option>
            <option value="scoped">scoped</option>
            <option value="active">active</option>
            <option value="review">review</option>
            <option value="done">done</option>
            <option value="invoiced">invoiced</option>
            <option value="paid">paid</option>
          </select>
        </dd>

        <dt>Client</dt>
        <dd>
          <input id="field-client" type="text" placeholder="Client name">
        </dd>

        <dt>Amount (USD)</dt>
        <dd>
          <input id="field-amount" type="number" min="0" step="0.01" placeholder="0.00">
        </dd>

        <dt>Due</dt>
        <dd>
          <input id="field-due" type="date">
        </dd>

        <dt>Links</dt>
        <dd id="field-links" class="field-links muted">Coming soon</dd>
      </dl>
    </aside>

    <article class="job-body">
      <h2>Notes</h2>
      <textarea id="job-body" class="markdown-body" rows="16" placeholder="Markdown notes…"></textarea>
    </article>

    <aside class="job-history">
      <h2>Recent changes</h2>
      <ol id="history-list" class="history-list">
        <li class="placeholder">No changes yet.</li>
      </ol>
    </aside>
  </main>

  <footer class="site-footer">
    <p id="connection-status" class="connection-status" data-state="connecting">Connecting…</p>
  </footer>

  <script type="module" src="/js/job.js"></script>
</body>
</html>
